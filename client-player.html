<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kicau Math - Player Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #1a472a 0%, #0a2a1a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            background: #2d5a3b;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 900px;  /* DIPERKECIL dari 1024px jadi 900px */
            width: 100%;
            margin: 0 auto;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1024 / 576;
            background: #87CEEB;
            border-radius: 15px;
            overflow: hidden;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #87CEEB;
        }
        .ui-panel {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .question-box {
            background: #f5e6c8;
            padding: 10px 15px;
            border-radius: 15px;
            flex: 2;
            text-align: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        #questionText {
            font-size: 1rem;
            font-weight: bold;
            color: #2c3e2f;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .answer-area {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }
        #answerInput {
            width: 120px;
            padding: 8px;
            font-size: 0.9rem;
            text-align: center;
            border: 2px solid #ffa500;
            border-radius: 25px;
            outline: none;
            font-weight: bold;
        }
        #submitBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #submitBtn:active {
            transform: scale(0.95);
        }
        #submitBtn:disabled {
            background: #888;
            cursor: not-allowed;
        }
        .player-status {
            background: rgba(0,0,0,0.7);
            padding: 8px 10px;
            border-radius: 15px;
            color: white;
            min-width: 160px;
            font-size: 0.7rem;
            max-height: 100px;
            overflow-y: auto;
        }
        .lobby-info {
            background: #ff9800;
            padding: 6px 12px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            text-align: center;
            flex: 1;
            font-size: 0.7rem;
        }
        .back-btn {
            background: #555;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.7rem;
            margin-bottom: 10px;
        }
        /* Untuk layar lebih kecil dari 900px (termasuk HP) */
        @media (max-width: 900px) {
            body {
                padding: 10px;
            }
            .container {
                max-width: 100%;
                padding: 12px;
            }
        }
        /* Untuk layar HP kecil */
        @media (max-width: 768px) {
            .ui-panel {
                flex-direction: column;
            }
            .question-box {
                width: 100%;
            }
            .player-status, .lobby-info {
                width: 100%;
            }
            .answer-area {
                flex-direction: row;
            }
            #answerInput {
                width: 100px;
                font-size: 0.85rem;
            }
            #submitBtn {
                padding: 6px 14px;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 480px) {
            .container {
                padding: 8px;
            }
            .player-status {
                font-size: 0.65rem;
                max-height: 80px;
            }
            #questionText {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='client-lobby.html'">← Kembali</button>
        <div class="canvas-container">
            <canvas id="gameCanvas" width="1024" height="576"></canvas>
        </div>
        <div class="ui-panel">
            <div class="question-box">
                <p id="questionText">🐦 KICAU MATH 🐦</p>
                <div class="answer-area">
                    <input type="number" id="answerInput" placeholder="Jawaban" autocomplete="off" disabled>
                    <button id="submitBtn" disabled>KIRIM</button>
                </div>
            </div>
            <div class="player-status" id="playerStatus"><h4>🐦 Pemain:</h4><div>Menunggu...</div></div>
            <div class="lobby-info" id="lobbyInfo"><p>🟡 Memulai...</p></div>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script src="client-player.js"></script>
</body>
</html>
